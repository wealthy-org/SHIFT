[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
robinhood_testnet = "${NEXT_PUBLIC_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
